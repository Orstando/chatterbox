    /*
        Toggle switch
        Credit: https://www.w3schools.com/howto/howto_css_switch.asp
    */
    .switch {
        position: relative;
        display: inline-block;
        width: 90px;
        height: 54px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 34px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 46px;
        width: 46px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        border-radius: 50%;
    }

    input:checked+.slider {
        background-color: #2196F3;
    }

    input:focus+.slider {
        box-shadow: 0 0 1px #2196F3;
    }

    input:checked+.slider:before {
        transform: translateX(36px);
    }

    #page-options {

</style>

    <script src="connection.js"></script>
    <script>
        // note to self: PLEASE PULL THIS FROM SERVER CONFIG WHEN HOSTED FROM SERVER
        // on the pi i have to pull from gh, and i usually redo my config here when the web client's code changes
        // pretty sure this would require either ejs or hosting a separate, dynamic config file
        
        const EXPIRY_DATE_MS = 3600000; // expiry date for login token (1 hour)
        // server info
        //const url = "127.0.0.1:3035";
        const url = "orstando-lpc:3035"
        const is_secure = false;

        const client = new Client("ChB-MobileClient", url, is_secure);
        client.onMessage = async function(data) {
            console.log("recieved", data)
            if (data.room == currentRoom[0]) {
                data.author.pfp = "img/pfp.png"
                appendMsg(data.author.pfp, data.author.name, data.content, (await getPlatformImage(data.platform)), data.image);
            };
        }
        client.onError = function(error) {
            appendSysMsg("Error", error.message, "red");
        }
        client.onClose = function() {
            appendSysMsg("Info", "Connection has closed", "orange");
        }

        var currentPage = "main";
        var lastPages = [];
        const pagesInModal = []
        function gotoPage(page) {
            lastPages.push(currentPage);
            document.getElementById("page-" + currentPage).classList.add("hidden");
            document.getElementById("page-" + page).classList.remove("hidden");
            currentPage = page;
        }
        function goBack() { // maps to android back button
            const page = lastPages.pop();
            document.getElementById("page-" + currentPage).classList.add("hidden");
            document.getElementById("page-" + page).classList.remove("hidden");
            currentPage = page;
        }

        function showErr(page, err) {
            const errEl = document.getElementById(page+"-err");
            errEl.innerText = err;
            errEl.classList.remove("hidden");
            console.error("["+page+"]", err);
        }
        function clearErr(page) {
            const errEl = document.getElementById(page+"-err");
            errEl.classList.add("hidden");
        }
        async function signin() {
            const username = document.getElementById("signin-username").value;
            const password = document.getElementById("signin-password").value;
            clearErr("signin")
            console.log("Logging in: ", username);
            if (!username || !password) {
                showErr("signin", "Error: Username or password are missing");
                return;
            }
            const data = await client.login(username, password);
            console.log(data)
            switch(data.error) {
                case "Banned":
                    showErr("signin", "Error: You are banned.\nReason: "+data.reason);
                    return;
                case "Invalid Token":
                    showErr("signin", "Error: Token invalid, please reload the page.");
                    return;
                case "Token verification error":
                    showErr("signin", "An unknown error occurred.");
                    return;
                case "Incorrect username or password":
                    showErr("signin", "Error: Incorrect username or password.");
                    return;
            }
            handleToken(data.token);
            setNavShown(true) // show nav
            await getRooms();
            enterRoom("general", "img/rooms/general.png");
            document.body.classList.remove("modalbg")
            gotoPage("chat");
        }
        async function signup() {
            const username = document.getElementById("signup-username").value;
            const password = document.getElementById("signup-password").value;
            console.log("Creating account:", username);
            clearErr("signup")
            if (!username || !password) {
                showErr("signup", "Error: Username or password are missing");
                return;
            }
            const data = await client.signup(username, password)
            switch(data.error) {
                case "Banned":
                    showErr("signup", "Error: You are banned.");
                    return;
                case "Missing fields": // shouldn't happen, already checked earlier
                    showErr("signup", "Error: Username or password are missing");
                    return;
                case "Username unavailable":
                    showErr("signup", "Error: Username already in use.");
                    return;
                case "Username too long":
                    showErr("signup", "Error: Username too long. Limit is "+data.limit+" characters.")
            }
            handleToken(data.token);
            setNavShown(true); // show nav
            await getRooms();
            enterRoom("general", "img/rooms/general.png");
            document.body.classList.remove("modalbg")
            gotoPage("chat");
        }

        document.getElementById("signin-menu-open-btn").addEventListener("click", function () {
            gotoPage("signin");
        });
        document.getElementById("signup-menu-open-btn").addEventListener("click", function () {
            gotoPage("signup");
        });

        document.getElementById("signin-submit").addEventListener("click", function () {
            signin();
        });
        document.getElementById("signup-submit").addEventListener("click", function () {
            signup();
        });

        function appendMsg(pfp, username, text, platform, img) {
            const messageDiv = document.createElement('div'); // message div
            messageDiv.classList.add("message");
            const pfpDiv = document.createElement('div'); // pfp div
            pfpDiv.classList.add("msg-pfp");
            const pfpImg = document.createElement('img'); // pfp img
            pfpImg.src = pfp;
            pfpDiv.appendChild(pfpImg);
            messageDiv.appendChild(pfpDiv);
            const inlinePlatformDiv = document.createElement('div'); // inline platform div
            inlinePlatformDiv.classList.add("msg-inline-platform");
            const unameDiv = document.createElement('div'); // username
            unameDiv.classList.add("msg-uname");
            unameDiv.innerText = username;
            inlinePlatformDiv.appendChild(unameDiv);
            const platformDiv = document.createElement('div'); // platform div
            platformDiv.classList.add("msg-platform");
            const platformImg = document.createElement('img'); // platform img
            platformImg.src = platform;
            platformDiv.appendChild(platformImg);
            inlinePlatformDiv.appendChild(platformDiv);
            messageDiv.appendChild(inlinePlatformDiv);
            const textDiv = document.createElement('div'); // text div
            textDiv.classList.add("msg-text");
            if (text) { // check if empty
                textDiv.innerText = text;
            } else {
                textDiv.innerHTML = "<i style='font-size:14px;'>[empty msg]</i>";
            }
            messageDiv.appendChild(textDiv);
            if (img) {
                const imgDiv = document.createElement('div'); // img div
                imgDiv.classList.add("msg-img");
                const imgEl = document.createElement('img'); // img el
                imgEl.src = img;
                imgDiv.appendChild(imgEl);
                messageDiv.appendChild(imgDiv);
            }
            appendAndScroll(messageDiv);
        }
        function getSysMsgElement(barColor) {
            const messageDiv = document.createElement('div'); // message div
            messageDiv.classList.add("message", "system-info");
            const titleDiv = document.createElement('div'); // title div
            titleDiv.classList.add("msg-sysinfo-title");
            const textDiv = document.createElement('div'); // text div
            textDiv.classList.add("msg-sysinfo-text", "roboto-font");
            if (barColor) { // append title+text to barDiv instead
                const barDiv = document.createElement('div');
                barDiv.classList.add("sysinfo-left-bar-container", "bar-"+barColor);
                barDiv.appendChild(titleDiv);
                barDiv.appendChild(textDiv);
                messageDiv.appendChild(barDiv);
            } else {
                messageDiv.appendChild(titleDiv);
                messageDiv.appendChild(textDiv);
            }
            return messageDiv;
        }
        function appendSysMsg(title, text, barColor) { // barColor can also be null, meaning no bar
            messageDiv = getSysMsgElement(barColor);
            titleDiv = messageDiv.querySelector(".msg-sysinfo-title");
            titleDiv.innerText = title;
            textDiv = messageDiv.querySelector(".msg-sysinfo-text");
            textDiv.innerText = text;

            appendAndScroll(messageDiv);
        }
        function appendWelcomeMsg(username) { // pretty much the same as appendSysMsg() but with a <span> for username
            messageDiv = getSysMsgElement("green");
            titleDiv = messageDiv.querySelector(".msg-sysinfo-title");

            const unameSpan = document.createElement('span');
            unameSpan.classList.add("welcomemsg-uname");
            unameSpan.innerText = username;

            titleDiv.append(unameSpan, "  has joined the chat.");
            textDiv = messageDiv.querySelector(".msg-sysinfo-text");
            textDiv.classList.add("roboto-font");
            textDiv.innerText = "Everyone say hi!";

            appendAndScroll(messageDiv);
        }
        // BUG: doesnt scroll all the say down
        function scrollToBottom() {
            const msgContainer = document.getElementById("messages");
            msgContainer.scrollTop = msgContainer.scrollHeight // later, make it first check if scrolled to bottom
        }
        function appendAndScroll(element) {
            const msgContainer = document.getElementById("messages");
            msgContainer.appendChild(element);
            // remove oldest hackyFixDiv
            // to test this: for(i=0;i<=100;i++){appendMsg("img/pfp.png","user","message","img/plt/Unknown.png")}
            if (msgContainer.firstChild.innerHTML && msgContainer.firstChild.innerHTML.startsWith("<br>")) {
                msgContainer.firstChild.firstChild.remove();
            }
            scrollToBottom();
        }

        function setNavShown(shown) {
            const navbar = document.getElementsByClassName("navbar")[0]
            if (shown) {
                navbar.classList.remove("hidden")
            } else {
                navbar.classList.add("hidden")
            }
        }

        function isNavEnabled() {
            // ill do it later okay
            return "yes of course definitely, not lying in any way whatsoever"
        }

        var currentlySelectedNav = ""
        function navBtn(btn) {
            if (isNavEnabled(btn) && isNavEnabled("all")) {
                gotoPage(btn);
                document.getElementById("navlink-"+btn).classList.add("navbar-selected")
                const elToDeselect = document.getElementById("navlink-"+currentlySelectedNav)
                if (elToDeselect) {
                    elToDeselect.classList.remove("navbar-selected");
                }
                currentlySelectedNav = btn
                if (btn == "chat") {
                    scrollToBottom();
                }
            }
        }

        function setRoomStatus(name, img) {
            const imgEl = document.createElement("img")
            imgEl.src = img
            document.getElementsByClassName("nav-roomStatus")[0].replaceChildren()
            document.getElementsByClassName("nav-roomStatus")[0].append(imgEl, "#"+name)
        }
        
        function appendRoom(icon, name, onlineCount) {
            const roomDiv = document.createElement('div'); // room div
            roomDiv.classList.add("room");
            const imgDiv = document.createElement('div'); // room img div
            imgDiv.classList.add("room-img");
            const imgEl = document.createElement('img'); // room img
            imgEl.src = icon;
            imgDiv.appendChild(imgEl);
            roomDiv.appendChild(imgDiv);
            const nameDiv = document.createElement('div'); // room name div
            nameDiv.classList.add("room-name");
            nameDiv.innerText = "#"+name;
            roomDiv.appendChild(nameDiv);
            //const breakFlexDiv = document.createElement('div'); // breakflex div
            //breakFlexDiv.classList.add("breakflex");
            //roomDiv.appendChild(breakFlexDiv);
            const onlineIndicatorDiv = document.createElement('div'); // online indicator div
            onlineIndicatorDiv.classList.add("room-online-indicator");
            const onlineIndicatorImg = document.createElement('img'); // online indicator img
            if (onlineCount) {
                onlineIndicatorImg.src = "img/online/green.png";
            } else {
                onlineIndicatorImg.src = "img/online/red.png";
            }
            onlineIndicatorDiv.appendChild(onlineIndicatorImg);
            roomDiv.appendChild(onlineIndicatorDiv);
            const onlineCountDiv = document.createElement('div'); // online count div
            onlineCountDiv.classList.add("room-online-count");
            onlineCountDiv.innerText = onlineCount.toString();
            roomDiv.appendChild(onlineCountDiv);
            roomDiv.addEventListener("click", function(event) { // do stuff on room click
                enterRoom(name, icon);
            });
            document.getElementsByClassName("rooms")[0].appendChild(roomDiv);
            return roomDiv;
        }

        var currentRoom = null;
        var roomDivs = {}
        function enterRoom(name, icon) {
            console.log(roomDivs)
            const roomDiv = roomDivs[name]
            setRoomStatus(name, icon);
            currentRoom = [name, icon];
            roomDiv.classList.add("room-selected");
            if (currentRoom) {
                roomDivs[currentRoom[0]].classList.remove("room-selected");
            }
            appendHackyFixDivs();
            getHistory();
        }

        function showInfo(type) {
            newDiv = document.createElement("div");
            newDiv.innerHTML = "Loading..."
            client.info(token, type.toLowerCase())
                .then((data) => {
                    newDiv.innerHTML =
                    "<h1 class='roboto-font inline-header info-header'>" + type + "</h1><br><p class='info-content'>"
                    + data.replaceAll("\n", "<br>")
                    + `</p><br><button class="btn btn-primary info-back" onclick="infoBack()">Back</button>`;
            })
            const infoContents = document.getElementById("page-infoContents");
            infoContents.replaceChildren(newDiv);
            gotoPage("infoContents") // using gotoPage here so that back button works
        }
        function infoBack() {
            gotoPage("info")
        }

        token = null
        function handleToken(tokenArg) {
            console.log(tokenArg)
            if (tokenArg) {
                token = tokenArg;
                toStore = JSON.stringify([token, (Date.now() + EXPIRY_DATE_MS)]); // has expiry date
                localStorage.setItem("authToken", toStore);
            } else {
                returned = JSON.parse(localStorage.getItem("authToken"));
                if (returned) { // check if exists
                    returnedToken = returned[0];
                    returnedExpiryDate = returned[1];
                    if (returnedExpiryDate > Date.now()) { // check if expired
                        token = returnedToken;
                        return token;
                    } else {
                        return null;
                    }
                } else {
                    return null;
                }
            }
        }
        async function getRooms() {
            data = await client.rooms(token)
            await Promise.all(data.map(async (item) => {
                online = await client.online(token, item[0]);
                const roomDiv = appendRoom("img/rooms/"+item+".png", item, online);
                console.log(roomDiv)
                roomDivs[item] = roomDiv;
                console.log(roomDivs)
            }));
            return data;
        }
        async function getHistory() {
            messages = await client.history(token, currentRoom[0]);
            for (const message of messages) {
                appendMsg(message.author.pfp, message.author.name, message.content, (await getPlatformImage(message.platform)), message.image);
            }
        }

        async function sendMessage() {
            message = document.getElementById("msg-textbox").value;
            console.log("Sending message:", message);
            data = await client.send(token, message, currentRoom[0], "Mobile")
            document.getElementById("msg-textbox").value = ""; // clear textbox
        }
        
        // https://stackoverflow.com/a/18837818
        async function doesImgExist(imageSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = imageSrc;
            });
        }
        async function getPlatformImage(platform) {
            return (await doesImgExist("img/plt/"+platform+".png") ? "img/plt/"+platform+".png" : "img/plt/Unknown.png")
        }
        
        function appendHackyFixDivs() {
            // hacky fix to keep messages at bottom on start
            // yes theres the same problem on the mobile client
            // no i dont feel like fixing it right now
            document.getElementById("messages").replaceChildren();
            const hackyFixDivs = new Array(100).fill(document.createElement("div")); // ah yes, "hackyFixDivs"
            hackyFixDivs.forEach(hackyFixDiv => {
                hackyFixDiv.classList.add("message");
                hackyFixBr = document.createElement("br");
                hackyFixDiv.appendChild(hackyFixBr);
                document.getElementById("messages").appendChild(hackyFixDiv);
            });
        }

        function getOptions() {
            return JSON.parse(localStorage.getItem("options")) || {}
        }
        optionsNeedRestart = ["devtools"]
        function setOption(name, state) {
            var options = getOptions();
            options[name] = state;
            localStorage.setItem("options", JSON.stringify(options));
            if (optionsNeedRestart.includes(name)) {
                document.getElementById("options-needsRestart").classList.remove("hidden");
            } else {
                document.getElementById("options-needsRestart").classList.add("hidden");
            }
        }
        function firstGetOptionsState() {
            const options = getOptions();
            for (const [name, state] of Object.entries(options)) {
                const optionDiv = document.getElementById("option-"+name);
                if (typeof(state) == "boolean") {
                    optionDiv.querySelector("label input").checked = state;
                }
            }
        }

        async function main() {
            gotoPage("loading");
            lastPages.pop();
            console.log(handleToken())
            if (!handleToken()) { // check if signed in
                document.body.classList.add("modalbg")
                gotoPage("main");
                setNavShown(false);
            }  else {
                const rooms = await getRooms();
                console.log(rooms)
                const firstRoom = rooms[0];
                console.log(firstRoom)
                enterRoom(firstRoom, "img/rooms/"+firstRoom+".png");
                navBtn("chat");
                firstGetOptionsState();
            }
        }
